<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Raycast-like</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    .shell {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 90%;
      height: 60px;
      border-radius: 14px;
      background: rgba(20, 20, 20, 0.95);
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      padding: 0 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 16px;
      background: transparent;
      color: #f5f5f5;
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="shell">
  <div>
    <div class="box">
      <input
              id="cmd"
              placeholder="Type a command or search…"
              autofocus
      />
    </div>
    <div class="hint">Press Esc to close</div>
  </div>
</div>

<script>
  const input = document.getElementById('cmd');

  window.addEventListener('DOMContentLoaded', () => {
    input.focus();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      window.close(); // main process will get blur and hide
    }
  });
</script>
</body>
</html>
